name: Campus API checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: ruff check backend && ruff format --check backend
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/app/web/app.js
      - run: docker build -t campus-ci .
      - name: Start built image and verify readiness
        run: |
          docker run -d --name campus-smoke -p 127.0.0.1:8000:8000 campus-ci sh -c 'python -m alembic -c backend/alembic.ini upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --no-access-log'
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:8000/ready
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs campus-smoke || true
          docker rm -f campus-smoke || true
  postgres-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campus_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: campus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campus_test -d campus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAMPUS_INTEGRATION_DATABASE_URL: postgresql+psycopg://campus_test:test-only-ci-password@127.0.0.1:5432/campus_test
      CAMPUS_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m unittest discover -s backend/tests -p test_infrastructure.py -v
