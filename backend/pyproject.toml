[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-lost-and-found-api"
version = "0.6.0"
description = "Campus Lost-and-Found API — Phase 6 private claims and handover"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
    "sqlalchemy==2.1.2",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
